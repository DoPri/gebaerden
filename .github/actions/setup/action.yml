name: Setup
description: Flutter toolchain, pub cache and the generated database code.

inputs:
  generate:
    description: Run build_runner. Off for jobs that only read pubspec.
    default: 'true'

runs:
  using: composite
  steps:
    # The Flutter version lives in mise.lock alone.
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: 2026.8.6
        install_args: flutter

    - uses: actions/cache@v6
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
        restore-keys: pub-${{ runner.os }}-

    - run: flutter pub get
      shell: bash

    - if: inputs.generate == 'true'
      run: dart run build_runner build
      shell: bash
