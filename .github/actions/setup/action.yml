name: Setup
description: Flutter toolchain, pub cache and the generated database code.

inputs:
  generate:
    description: Run build_runner. Off for jobs that only read pubspec.
    default: 'true'

runs:
  using: composite
  steps:
    # The Flutter version lives in mise.lock alone.
    - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        install_args: flutter

    - uses: actions/cache@v6
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
        restore-keys: pub-${{ runner.os }}-

    - run: flutter pub get
      shell: bash

    - if: inputs.generate == 'true'
      run: dart run build_runner build
      shell: bash
