version: 2

updates:
  # The workflows and the composite action they all go through.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      dart:
        patterns: ['*']
