name: Release

# A tag without a suffix ships everywhere. A tag like v1.0.1-rc1 stays on
# GitHub as a pre-release, so testers reach it through Obtainium without
# anything landing in Play.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same definition CI runs, so the two cannot drift apart.
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: The tag has to match the version in pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: ./.github/actions/setup

      - name: Keystore from the secret
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      # The bundle is what Play takes. The split APKs are for the GitHub
      # release, which is what Obtainium and a plain sideload read.
      - name: Build
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release
          flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      # Binds the digests to this run, so anyone can check that an APK really
      # came out of this workflow on this commit.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/bundle/release/*.aab

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: build/app/outputs/flutter-apk/*-release.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          bundler-cache: true

      - name: Play internal testing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: bundle exec fastlane android internal

      - run: rm -f "$RUNNER_TEMP/release.jks"
        if: always()
