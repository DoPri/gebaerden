name: Release

# A tag without a suffix ships everywhere. A tag like v1.0.1-rc1 stays on
# GitHub as a pre-release, so testers reach it through Obtainium without
# anything landing in Play.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same definition CI runs, so the two cannot drift apart.
  check:
    uses: ./.github/workflows/ci.yml

  # Same app as the APK, as a static site behind nginx.
  image:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      # ghcr takes no capital letters and the repository has two.
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag like v1.0.1-rc1 publishes under its own version and leaves
      # latest where it is, the same way it stays a pre-release on GitHub.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same trail the APKs carry, so a pulled image can be traced back to
      # the run that built it.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: The tag has to match the version in pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: ./.github/actions/setup

      - name: Keystore from the secret
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      # The bundle is what Play takes. The split APKs are for the GitHub
      # release, which is what Obtainium and a plain sideload read.
      - name: Build
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release
          flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      # Binds the digests to this run, so anyone can check that an APK really
      # came out of this workflow on this commit.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/bundle/release/*.aab

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: build/app/outputs/flutter-apk/*-release.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          ruby-version: '4.0.6'
          bundler-cache: true

      - name: Play internal testing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: bundle exec fastlane android internal

      - run: rm -f "$RUNNER_TEMP/release.jks"
        if: always()
