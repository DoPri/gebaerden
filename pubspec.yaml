name: gebaerden
description: Deutsche Gebärdensprache lernen mit Videos von SignDict.
publish_to: none
version: 1.0.0-rc7+7

environment:
  sdk: ^3.12.2

dependencies:
  background_downloader: ^9.5.7
  connectivity_plus: ^7.3.1
  cross_file: ^0.3.5+4
  cupertino_icons: ^1.0.8
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  flutter_local_notifications: ^22.2.0
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^5.1.0
  fsrs: ^2.0.1
  go_router: ^17.4.0
  http: ^1.6.0
  path_provider: ^2.1.6
  receive_sharing_intent: ^1.9.0
  share_plus: ^13.3.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  video_player: ^2.13.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Only for the fake player in the tests.
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
